version: "1.0"
metadata:
  name: "models"
  description: "Model configurations for different use cases"

models:
  mcp_evaluator_v1:
    name: "MCP Evaluator (Haiku)"
    version: "2.0"
    provider: "anthropic"
    model_id: "claude-haiku-5-5"
    config:  # passed to messages.create as-is
      max_tokens: 500
      thinking:
        type: "disabled"
    content_limits:
      max_words: 5000
      max_chars: 30000
    cost_per_token:
      input: 0.0001
      output: 0.0005
  
  mcp_evaluator_sonnet:
    name: "MCP Evaluator (Sonnet)"
    version: "2.0"
    provider: "anthropic"
    model_id: "claude-sonnet-5-5"
    config:  # passed to messages.create as-is
      max_tokens: 500
      thinking:
        type: "between_tools"  # Sonnet 5.5 rejects "disabled"
    content_limits:
      max_words: 8000
      max_chars: 50000
    cost_per_token:
      input: 0.002
      output: 0.010