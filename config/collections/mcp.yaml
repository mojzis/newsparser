name: mcp

topic:
  name: "Model Context Protocol (MCP)"
  description: "MCP is a protocol for AI tool integration that allows language models to access external tools and data sources."
  min_relevance_score: 0.3

ui:
  site_title: "MCP Monitor"
  site_tagline: "Daily digest of Model Context Protocol mentions"
  theme: "default"

evaluation:
  prompt_config: "mcp_evaluation_v1"
  model_config: "mcp_evaluator_v1"

default_search: mcp_tag

searches:
  searches:
    mcp_mentions:
      name: "MCP Protocol Mentions"
      description: "Posts about Model Context Protocol"
      include_terms:
        - "mcp"
        - "model context protocol"
        - "anthropic mcp"
      exclude_terms:
        - "minecraft"
        - "#mcp AND (medical OR healthcare OR clinic)"
      sort: "latest"
      enabled: true

    mcp_tools:
      name: "MCP Tools and Implementations"
      description: "Posts about MCP tools and implementations"
      include_terms:
        - "mcp tool"
        - "mcp server"
        - "mcp client"
        - "mcp implementation"
      exclude_terms:
        - "minecraft"
      sort: "latest"
      enabled: true

    mcp_tag2:
      name: "tag #mcp"
      description: "Posts about MCP tools and implementations"
      query_syntax: "native"
      include_terms:
        - "#mcp"
      exclude_terms:
      sort: "latest"
      enabled: true

    mcp_tag:
      name: "tag #mcp - #minipainting"
      description: "Posts about MCP tools and implementations"
      query_syntax: "native"
      include_terms:
        - "#mcp"
      exclude_terms:
        - "#minipainting"
        - "#marvel"
      sort: "latest"
      enabled: true

    mcp_integrations:
      name: "MCP Integrations"
      description: "Posts about MCP integrations and usage"
      include_terms:
        - "(mcp AND (integration OR claude OR anthropic))"
        - "model context protocol integration"
      exclude_terms:
        - "minecraft"
        - "(medical OR healthcare) AND #mcp"
      sort: "latest"
      enabled: false  # Disabled by default, can be enabled as needed
