[project]
name = "newsparser"
version = "0.1.0"
description = "Parse bluesky posts."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "atproto>=0.0.54",
    "click>=8.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "html2text>=2020.1.16",
    "nest-asyncio>=1.6.0",
    "anthropic>=0.54.0",
    "jinja2>=3.1.6",
    "duckdb>=1.3.1",
]

[project.scripts]
nsp = "src.cli.new_commands:cli"
onsp = "src.cli.legacy_commands:legacy_cli"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "moto>=5.0.0",
    "hypothesis>=6.92.0",
    "ruff>=0.8.0",
    "ty",
    "marimo>=0.10.0",
    "poethepoet>=0.47.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C40",  # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "DJ",   # flake8-django
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "AIR",  # airflow
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
]

ignore = [
    "ANN401",  # any-type
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with formatter)
    "S101",    # assert
    "S106",    # hardcoded-password-argument (test fixtures)
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "FIX002",  # line-contains-todo
    "TRY003",  # raise-vanilla-args (too strict for simple validation)
    "EM101",   # raw-string-in-exception (too strict for simple validation)
    "EM102",   # f-string-in-exception (too strict for simple validation)
    "PLR2004", # magic-value-comparison (too strict for date constants)
    "DTZ001",  # call-datetime-without-tzinfo (tests use naive datetime)
    "SLF001",  # private-member-access (needed for testing formatter internals)
    "N805",    # invalid-first-argument-name-for-class-method (pydantic validators use cls)
    "RUF012",  # mutable-class-default (pydantic config pattern)
    # --- Triage of the migration ruleset bump (deliberately not chasing to zero) ---
    "E501",    # line-too-long (formatter wraps code; remainder is urls/strings/comments)
    "ANN001",  # missing-type-function-argument (high-volume, low value here)
    "ANN202",  # missing-return-type-private-function (high-volume, low value here)
    "G004",    # logging-f-string (harmless, pervasive pattern)
    "FBT001",  # boolean-positional-arg (common in the click CLI)
    "FBT002",  # boolean-default-positional-arg (common in the click CLI)
    "FBT003",  # boolean-positional-value-in-call
    "PLC0415", # import-outside-top-level (intentional lazy imports)
    "TRY300",  # try-consider-else (stylistic)
    "BLE001",  # blind-except: `except Exception` is the deliberate log-and-continue
               # resilience pattern for this daily batch scraper (one bad post/URL/API
               # response must not abort the run); narrowing 78 catch-alls is churn
    "TRY301",  # raise-within-try (stylistic; abstracting raises to inner fns is over-engineering here)
    # --- Ruleset trim: converge to ~0 by design, not by chasing thresholds (MVP) ---
    "PLR0911", # too-many-return-statements  } refactoring working code purely to hit
    "PLR0912", # too-many-branches           } complexity thresholds is premature
    "PLR0913", # too-many-arguments          } optimization; contradicts MVP guidance
    "PLR0915", # too-many-statements         }
    "T201",    # print (intentional user-facing CLI + diagnostic/stats output)
    "ARG001",  # unused-function-argument    } signature/interface conformance
    "ARG002",  # unused-method-argument      } (callbacks, overrides, click options)
    "ARG004",  # unused-static-method-argument
    "RUF001",  # ambiguous-unicode (mostly content strings and emoji)
    "A001",    # builtin-variable-shadowing (id/type/etc. as locals; low risk)
    "PTH123",  # builtin-open (pathlib migration is low-value churn here)
    "PD008",   # pandas-use-of-dot-at (fine for these small frames)
    "RSE102",  # unnecessary-paren-on-raise (raise X() reads clearer than raise X)
    "PERF401", # manual-list-comprehension  } not hot paths; readability-neutral
    "PERF402", # manual-list-copy           }
    "SIM117",  # multiple-with-statements (nested context managers read fine here)
    "PLW0603", # global-statement (module singletons: get_settings/get_config_manager)
    "PLW1510", # subprocess-run-without-check (returncode/output checked manually)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "S101",    # assert
    "S105",    # hardcoded-password-string (dummy credential fixtures)
    "ANN",     # type annotations
    "ARG",     # unused arguments
    "PLR2004", # magic value comparison
    "PT011",   # pytest-raises-too-broad (fine for these assertions)
    "PT018",   # pytest-composite-assertion
]
# marimo notebooks: cell-based style trips many rules that don't apply to them
"notebooks/**/*" = [
    "ANN",     # annotations
    "B018",    # useless-expression (bare cell output, e.g. mo.md(...))
    "N802",    # invalid-function-name (marimo cell funcs)
    "N803",    # invalid-argument-name
    "N806",    # non-lowercase-variable-in-function
    "N807",    # dunder-function-name (marimo cell funcs)
    "INP001",  # implicit-namespace-package
    "COM818",  # trailing-comma-on-bare-tuple
    "T20",     # print
    "PD011",   # pandas-use-of-dot-values
    "ARG",     # unused arguments (cell signature deps)
    "F401",    # unused-import (cross-cell imports)
    "S608",    # hardcoded-sql (exploratory notebook queries, not user-facing)
    "B007",    # unused-loop-control-variable (exploratory cells)
]

[tool.ty]
# ty configuration for type checking (part of ruff ecosystem)

[tool.poe]
verbosity = -1
include = "poe_tasks.toml"
